# ============================================
# Framework Configuration
# Edit these values — they are used across all tests.
# Override on the command line with: -Dkey=value
# ============================================

# --- Browser ---
browser=chrome
headless=false
window.maximize=false

# --- Waits (in seconds) ---
implicit.wait.seconds=1
explicit.wait.seconds=30
page.load.timeout.seconds=15

# --- Test retry (0 = no retry, 1 = retry once, etc.) ---
retry.count=2

# --- Reporting ---
screenshot.on.pass=false

# --- UI base URL (default; can be overridden in testng.xml with <parameter name="BASE_URL">) ---
default.base.url=https://mis-release.bromcom.dev/

